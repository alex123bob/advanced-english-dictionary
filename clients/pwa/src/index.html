<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123c69">
  <title>Advanced Dictionary PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Installable Dictionary</p>
      <h1>Words, wherever you read.</h1>
      <p class="lede">A small PWA shell for fast lookup with offline app startup and recent search memory.</p>
    </header>

    <form id="searchForm" class="search-card">
      <label for="searchInput">Search word or phrase</label>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="serendipity" autocomplete="off" spellcheck="false" required>
        <button type="submit">Look up</button>
      </div>
    </form>

    <section id="status" class="status" hidden></section>

    <section id="result" class="result-card" hidden>
      <div class="result-heading">
        <div>
          <p class="eyebrow">Result</p>
          <h2 id="headword"></h2>
          <p id="pronunciation" class="muted"></p>
        </div>
        <span id="partOfSpeech" class="badge"></span>
      </div>
      <div id="definitions" class="definitions"></div>
      <a id="openWebsite" class="website-link" href="#">Open full website result</a>
    </section>

    <section class="panel-grid">
      <article class="panel">
        <div class="panel-title-row">
          <h2>Recent</h2>
          <button id="clearRecent" class="link-button" type="button">Clear</button>
        </div>
        <div id="recentList" class="chip-list"></div>
      </article>

      <article class="panel">
        <h2>Settings</h2>
        <label class="setting-label" for="apiBaseUrl">API base URL</label>
        <input id="apiBaseUrl" class="setting-input" type="url" placeholder="http://localhost:8000">
        <label class="setting-label" for="websiteUrl">Website URL</label>
        <input id="websiteUrl" class="setting-input" type="url" placeholder="https://www.lijialab.com">
        <button id="saveSettings" class="secondary-button" type="button">Save settings</button>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
