<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Store guideline: 128 x 128 canvas, 96 x 96 artwork, 16 px transparent padding.
     icon.svg draws its tile at 8..120 of a 128 viewBox, so scale it by 96/112
     and shift it so that tile lands exactly on 16..112. */
  html,body{margin:0;width:128px;height:128px;overflow:hidden;background:transparent}
  img{position:absolute;width:109.714px;height:109.714px;left:9.143px;top:9.143px}
</style></head>
<body><img src="../../src/icons/icon.svg" alt=""></body></html>
