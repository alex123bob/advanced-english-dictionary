<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{background:linear-gradient(135deg,#3b2fc9 0%,#4f46e5 45%,#0e8fb8 100%);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45}
  .g1{width:220px;height:220px;background:#5eead4;right:-60px;top:-80px}
  .g2{width:180px;height:180px;background:#a78bfa;left:-60px;bottom:-80px}
  .wrap{position:relative;display:flex;align-items:center;gap:22px;padding:0 34px;height:100%}
  img{width:118px;height:118px;flex:none;filter:drop-shadow(0 10px 18px rgba(15,23,42,.35))}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.05;margin:0 0 12px;font-weight:700}
  p{margin:0;font-size:15px;line-height:1.4;opacity:.92}
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <img src="../../src/icons/icon.svg" alt="">
    <div>
      <h1>Advanced English Dictionary</h1>
      <p>Select any word on a page for an instant definition.</p>
    </div>
  </div>
</body></html>
