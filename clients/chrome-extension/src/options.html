<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced English Dictionary Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options-shell">
    <header>
      <p class="eyebrow">Advanced English Dictionary</p>
      <h1>Extension settings</h1>
      <p class="lede">Point the extension at your API and website instance.</p>
    </header>

    <form id="optionsForm" class="settings-form">
      <label>
        <span>Dictionary API base URL</span>
        <input id="apiBaseUrl" type="url" placeholder="http://localhost:8000" required>
      </label>

      <label>
        <span>Website base URL</span>
        <input id="websiteUrl" type="url" placeholder="https://www.lijialab.com" required>
      </label>

      <button type="submit">Save settings</button>
      <p id="savedMessage" class="saved-message" hidden>Saved.</p>
    </form>
  </main>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
